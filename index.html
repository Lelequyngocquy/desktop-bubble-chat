<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesktopBubbleChat</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('desktop_bubble_chat_settings');
          var mode = 'system';
          var lang = 'en';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              if (parsed.state.themeMode) mode = parsed.state.themeMode;
              if (parsed.state.language === 'vi' || parsed.state.language === 'en') lang = parsed.state.language;
            }
          }
          document.documentElement.lang = lang;
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-transparent antialiased select-none overflow-hidden text-content-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
