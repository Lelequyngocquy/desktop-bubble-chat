name: "Release & Publish DesktopBubbleChat (Multi-OS)"

on:
  push:
    tags:
      - "v*" # Triggered automatically on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  publish-tauri:
    name: "Build & Package (${{ matrix.platform }})"
    permissions:
      contents: write # Required permission to create releases and upload binary assets + latest.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            targets: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "macos-latest"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            targets: "x86_64-unknown-linux-gnu"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v4

      - name: "2. Install Linux system dependencies"
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            xdg-utils \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: "3. Setup Node.js environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "4. Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: "5. Enable Rust cache to optimize build times"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: "6. Install frontend dependencies"
        run: npm ci

      - name: "7. Build, Sign & Publish Release"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # Automatically resolved from tauri.conf.json
          releaseName: "DesktopBubbleChat v__VERSION__"
          releaseBody: "Latest release of DesktopBubbleChat. Download assets below or wait for in-app auto-update."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
